name: dbnube-240071

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-40071}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbnube

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_test}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-40072}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dbnube

  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Define PGADMIN_DEFAULT_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Define PGADMIN_DEFAULT_PASSWORD en .env}
    ports:
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_HOST_PORT:-54071}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dbnube

networks:
  dbnube:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  pgadmin_data:

